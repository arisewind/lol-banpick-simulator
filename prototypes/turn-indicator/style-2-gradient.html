<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案2 - 非对称渐变</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lol-blue:#1565C0; --lol-blue-light:#42A5F5;
    --lol-red:#C62828; --lol-red-light:#EF5350;
    --bg-dark:#15151A; --text-muted:#8A8A99;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg-dark); color:#fff; padding:24px; }
  .container { max-width:680px; margin:0 auto; }
  h1 { font-size:18px; margin-bottom:4px; color:#FFB300; }
  .desc { color:var(--text-muted); font-size:13px; margin-bottom:24px; line-height:1.6; }
  .demo { margin-bottom:28px; }
  .demo-label { font-size:12px; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
  /* 方案2 核心:非对称渐变,视觉重心偏向当前方
     蓝方:左实右淡(重心左偏);红方:右实左淡(重心右偏) */
  .turn-bar {
    display:flex; align-items:center; padding:14px 24px; border-radius:6px;
    font-weight:700; font-size:15px; letter-spacing:1px; border:2px solid;
  }
  .turn-bar.blue {
    background:linear-gradient(to right, rgba(21,101,192,0.55), rgba(21,101,192,0.10) 70%);
    border-color:rgba(21,101,192,0.6);
    color:#fff; box-shadow:1px 1px 3px 0 #000;
    justify-content:flex-start; /* 文字靠左 */
  }
  .turn-bar.red {
    background:linear-gradient(to left, rgba(198,40,40,0.55), rgba(198,40,40,0.10) 70%);
    border-color:rgba(198,40,40,0.6);
    color:#fff; box-shadow:1px 1px 3px 0 #000;
    justify-content:flex-end; /* 文字靠右 */
  }
  .scheme-tag {
    position:fixed; top:16px; right:24px; z-index:100;
    background:#FFB300; color:#000; padding:6px 14px; border-radius:4px; font-weight:700; font-size:12px;
  }
</style>
</head>
<body>
<div class="scheme-tag">方案2 · 非对称渐变</div>
<div class="container">
  <h1>方案 2 · 非对称渐变</h1>
  <p class="desc">条用方向性渐变:蓝方左实右淡(视觉重心偏左,指向蓝方面板),红方反之。文字也跟着偏向当前方。含蓄但有方向感。</p>

  <div class="demo">
    <div class="demo-label">蓝方回合(重心偏左)</div>
    <div class="turn-bar blue"><span>禁用英雄 - 蓝方回合</span></div>
  </div>

  <div class="demo">
    <div class="demo-label">红方回合(重心偏右)</div>
    <div class="turn-bar red"><span>禁用英雄 - 红方回合</span></div>
  </div>
</div>
</body>
</html>
