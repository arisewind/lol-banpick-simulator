<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Fiddlesticks 原画对比</title>
<style>
  body { background:#15151A; color:#fff; font-family:sans-serif; padding:20px; margin:0; }
  h1 { font-size:16px; color:#FFB300; }
  .row { display:flex; gap:16px; margin-top:16px; align-items:flex-start; }
  .col { flex:1; }
  .col h3 { margin:0 0 8px; font-size:13px; color:#8A8A99; }
  .col img { width:100%; border:1px solid #2E2E3A; border-radius:4px; display:block; }
  .desc { color:#888; font-size:12px; margin:4px 0 0; }
</style>
</head>
<body>
<h1>远古恐惧(Fiddlesticks)原画对比</h1>
<p class="desc">左:splash 横版(原 pick 槽用的,你说怀旧) · 右:loading 竖版(回退后用的)</p>
<div class="row">
  <div class="col">
    <h3>splash 横版(旧,已被回退)</h3>
    <img src="https://ddragon.leagueoflegends.com/img/champion/splash/Fiddlesticks_0.jpg" alt="splash">
  </div>
  <div class="col">
    <h3>loading 竖版(新,当前 pick 槽)</h3>
    <img src="https://ddragon.leagueoflegends.com/img/champion/loading/Fiddlesticks_0.jpg" alt="loading">
  </div>
</div>
</body>
</html>
