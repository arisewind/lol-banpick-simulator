<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案5 - 单色方位箭头(仿参考图)</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lol-gold:#FFB300;
    --bg-dark:#15151A; --bg-secondary:#1F1F28; --bg-card:#25252F;
    --lol-black:#010a13; --border:#2E2E3A;
    --text-muted:#8A8A99; --text-secondary:#CCCCCC;
    /* 关键:未选=暗灰,选中=亮白(明暗对比,无彩色) */
    --icon-dim:#5A5A66;     /* 未选:暗灰 */
    --icon-bright:#FFFFFF;  /* 选中:亮白 */
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg-dark); color:#fff; padding:24px; }
  .container { max-width:720px; margin:0 auto; }
  h1 { font-size:18px; margin-bottom:4px; color:var(--lol-gold); }
  .desc { color:var(--text-muted); font-size:13px; margin-bottom:20px; line-height:1.6; }
  .toolbar {
    display:flex; align-items:center; gap:6px; padding:12px;
    background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px;
  }
  .search {
    width:144px; flex-shrink:0; padding:8px 12px; font-size:14px;
    background:var(--lol-black); border:1px solid var(--border); border-radius:4px; color:#fff; font-family:inherit;
  }
  .search::placeholder { color:var(--text-muted); }
  .lanes { display:flex; align-items:center; gap:2px; }
  .lane-btn {
    width:36px; height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .15s; background:transparent; border:none; color:var(--icon-dim);
  }
  .lane-btn:hover { color:var(--text-secondary); }
  /* 选中态:明暗对比 → 变亮白(不加边框/底色,纯靠图标亮度) */
  .lane-btn.active { color:var(--icon-bright); }
  .lane-btn svg { width:26px; height:26px; display:block; }
  .count { margin-left:auto; flex-shrink:0; font-size:12px; color:var(--text-muted); }
  .scheme-tag {
    position:fixed; top:16px; right:24px; z-index:100;
    background:var(--lol-gold); color:#000; padding:6px 14px; border-radius:4px; font-weight:700; font-size:12px;
  }
  .hint { margin-top:16px; font-size:12px; color:var(--text-muted); }
  .compare { margin-top:24px; display:flex; gap:20px; align-items:flex-start; }
  .compare > div { flex:1; }
  .compare h3 { font-size:13px; color:var(--lol-gold); margin-bottom:8px; }
  .compare img { max-width:100%; border:1px solid var(--border); border-radius:6px; }
</style>
</head>
<body>
<div class="scheme-tag">方案5 · 单色方位箭头(仿参考图)</div>
<div class="container">
  <h1>方案 5 · 单色方位箭头(仿参考图)</h1>
  <p class="desc">每个分路一个朝向的箭头,表示在 Summoner's Rift 地图上的方位。单色线条勾勒,未选暗灰、选中亮白(纯明暗对比,无彩色/边框)。</p>
  <div class="toolbar">
    <input class="search" placeholder="搜索英雄...">
    <div class="lanes">
      <!-- 上单:朝左上的箭头(地图左上路) -->
      <button class="lane-btn" title="上单 Top" aria-label="上单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19 L5 9 M5 9 L13 9 M5 9 L19 19"/>
        </svg>
      </button>
      <!-- 打野:中心圆点+辐射(野区中央) -->
      <button class="lane-btn" title="打野 Jungle" aria-label="打野">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
          <path d="M12 5 L12 8 M12 16 L12 19 M5 12 L8 12 M16 12 L19 12"/>
        </svg>
      </button>
      <!-- 中单:斜向箭头(中路沿对角线) -->
      <button class="lane-btn" title="中单 Mid" aria-label="中单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 18 L6 11 M6 11 L13 11 M6 11 L18 18"/>
        </svg>
      </button>
      <!-- 下路:朝右下的箭头(地图右下路) -->
      <button class="lane-btn" title="下路 ADC" aria-label="下路">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 5 L12 5 M12 5 L12 12 M12 5 L19 19"/>
        </svg>
      </button>
      <!-- 辅助:跟随箭头/小盾(陪下路) -->
      <button class="lane-btn" title="辅助 Support" aria-label="辅助">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4 L19 7 L19 13 C19 16 16 19 12 20 C8 19 5 16 5 13 L5 7 Z"/>
        </svg>
      </button>
    </div>
    <span class="count">共 173 位英雄</span>
  </div>

  <div class="compare">
    <div>
      <h3>↑ 本方案(单色方位箭头)</h3>
      <p class="hint">点击图标切换。未选暗灰,选中亮白。</p>
    </div>
  </div>

  <p class="hint" style="margin-top:20px;">方位约定(SR 地图蓝方左下视角):上单=左上,打野=中心,中单=斜向,下路=右下,辅助=盾(守护下路)。若箭头朝向和参考图不一致,告诉我具体哪个要改。</p>
</div>
<script>
  document.querySelectorAll('.lane-btn').forEach(b => b.addEventListener('click', () => b.classList.toggle('active')));
</script>
</body>
</html>
