<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案3 - 简笔线性符号</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lol-gold:#FFB300; --bg-dark:#15151A; --bg-secondary:#1F1F28; --bg-card:#25252F;
    --lol-black:#010a13; --border:#2E2E3A; --text-muted:#8A8A99; --text-secondary:#CCCCCC;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg-dark); color:#fff; padding:24px; }
  .container { max-width:720px; margin:0 auto; }
  h1 { font-size:18px; margin-bottom:4px; color:var(--lol-gold); }
  .desc { color:var(--text-muted); font-size:13px; margin-bottom:20px; line-height:1.6; }
  .toolbar {
    display:flex; align-items:center; gap:6px; padding:12px;
    background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px;
  }
  .search {
    width:144px; flex-shrink:0; padding:8px 12px; font-size:14px;
    background:var(--lol-black); border:1px solid var(--border); border-radius:4px; color:#fff; font-family:inherit;
  }
  .search::placeholder { color:var(--text-muted); }
  .lanes { display:flex; align-items:center; gap:4px; }
  .lane-btn {
    width:36px; height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border-radius:4px; cursor:pointer; transition:all .15s;
    border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary);
  }
  .lane-btn:hover { border-color:rgba(255,179,0,0.6); color:#fff; }
  .lane-btn.active {
    border:2px solid var(--lol-gold); background:var(--lol-gold); color:#000;
    box-shadow:2px 2px 5px 0 #000; width:35px;
  }
  .lane-btn svg { width:20px; height:20px; display:block; }
  .count { margin-left:auto; flex-shrink:0; font-size:12px; color:var(--text-muted); }
  .scheme-tag {
    position:fixed; top:16px; right:24px; z-index:100;
    background:var(--lol-gold); color:#000; padding:6px 14px; border-radius:4px; font-weight:700; font-size:12px;
  }
  .hint { margin-top:16px; font-size:12px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="scheme-tag">方案3 · 简笔线性符号</div>
<div class="container">
  <h1>方案 3 · 简笔线性符号风格</h1>
  <p class="desc">每个分路一个具象符号：剑（上单）/树（打野）/闪电（中单）/弓箭（下路）/盾（辅助）。线条粗壮、辨识清晰，有战斗语义。</p>
  <div class="toolbar">
    <input class="search" placeholder="搜索英雄...">
    <div class="lanes">
      <!-- 上单:剑(竖直,十字护手) -->
      <button class="lane-btn" title="上单" aria-label="上单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 L12 16"/>
          <path d="M8 7 L16 7"/>
          <path d="M12 16 L10 21 M12 16 L14 21"/>
        </svg>
      </button>
      <!-- 打野:树(三角冠 + 树干) -->
      <button class="lane-btn" title="打野" aria-label="打野">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 L6 11 L9 11 L4 18 L20 18 L15 11 L18 11 Z"/>
          <path d="M12 18 L12 21"/>
        </svg>
      </button>
      <!-- 中单:闪电 -->
      <button class="lane-btn" title="中单" aria-label="中单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 L5 13 L11 13 L9 22 L19 9 L13 9 Z"/>
        </svg>
      </button>
      <!-- 下路:弓箭(弓弧 + 箭) -->
      <button class="lane-btn" title="下路" aria-label="下路">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3 C5 10 5 14 5 21"/>
          <path d="M5 12 L19 12"/>
          <path d="M16 9 L19 12 L16 15"/>
        </svg>
      </button>
      <!-- 辅助:盾牌 -->
      <button class="lane-btn" title="辅助" aria-label="辅助">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 L20 6 L20 12 C20 16 16 20 12 21 C8 20 4 16 4 12 L4 6 Z"/>
          <path d="M9 12 L11 14 L15 10"/>
        </svg>
      </button>
    </div>
    <span class="count">共 173 位英雄</span>
  </div>
  <p class="hint">具象战斗符号：剑/树/闪电/弓/盾。hover 显示中文。语义直白，线条粗壮在小尺寸下仍清晰。</p>
</div>
<script>
  document.querySelectorAll('.lane-btn').forEach(b => b.addEventListener('click', () => b.classList.toggle('active')));
</script>
</body>
</html>
