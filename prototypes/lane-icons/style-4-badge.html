<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案4 - 实心填充徽章</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lol-gold:#FFB300; --bg-dark:#15151A; --bg-secondary:#1F1F28; --bg-card:#25252F;
    --lol-black:#010a13; --border:#2E2E3A; --text-muted:#8A8A99; --text-secondary:#CCCCCC;
    /* 五个分路的主题色(模仿 LOL 客户端 position 配色) */
    --lane-top:#E83E8C;      /* 上单:品红 */
    --lane-jungle:#28A745;   /* 打野:翠绿 */
    --lane-mid:#DC3545;      /* 中单:正红 */
    --lane-bot:#17A2B8;      /* 下路:青蓝 */
    --lane-support:#FFC107;  /* 辅助:金黄 */
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg-dark); color:#fff; padding:24px; }
  .container { max-width:720px; margin:0 auto; }
  h1 { font-size:18px; margin-bottom:4px; color:var(--lol-gold); }
  .desc { color:var(--text-muted); font-size:13px; margin-bottom:20px; line-height:1.6; }
  .toolbar {
    display:flex; align-items:center; gap:6px; padding:12px;
    background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px;
  }
  .search {
    width:144px; flex-shrink:0; padding:8px 12px; font-size:14px;
    background:var(--lol-black); border:1px solid var(--border); border-radius:4px; color:#fff; font-family:inherit;
  }
  .search::placeholder { color:var(--text-muted); }
  .lanes { display:flex; align-items:center; gap:5px; }
  .lane-btn {
    width:36px; height:36px; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center;
    border-radius:6px; cursor:pointer; transition:all .15s; padding:0;
    border:2px solid transparent; background:var(--bg-card);
    filter:grayscale(0.7) brightness(0.7);
  }
  .lane-btn::before {
    content:''; position:absolute; inset:0; border-radius:4px; opacity:0.18;
  }
  .lane-btn[data-lane="top"]::before      { background:var(--lane-top); }
  .lane-btn[data-lane="jungle"]::before   { background:var(--lane-jungle); }
  .lane-btn[data-lane="mid"]::before      { background:var(--lane-mid); }
  .lane-btn[data-lane="bot"]::before      { background:var(--lane-bot); }
  .lane-btn[data-lane="support"]::before  { background:var(--lane-support); }
  .lane-btn svg { width:22px; height:22px; display:block; position:relative; z-index:1; color:#fff; }
  .lane-btn:hover { filter:grayscale(0.3) brightness(0.9); border-color:rgba(255,179,0,0.6); }
  .lane-btn.active {
    filter:none; border-color:var(--lol-gold);
    box-shadow:0 0 0 1px var(--lol-gold), 2px 2px 5px 0 #000;
  }
  .count { margin-left:auto; flex-shrink:0; font-size:12px; color:var(--text-muted); }
  .scheme-tag {
    position:fixed; top:16px; right:24px; z-index:100;
    background:var(--lol-gold); color:#000; padding:6px 14px; border-radius:4px; font-weight:700; font-size:12px; font-family:'Orbitron';
  }
  .hint { margin-top:16px; font-size:12px; color:var(--text-muted); }
  .legend { margin-top:14px; display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--text-muted); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
</style>
</head>
<body>
<div class="scheme-tag">方案4 · 实心填充徽章</div>
<div class="container">
  <h1>方案 4 · 实心填充彩色徽章风格</h1>
  <p class="desc">每个分路独立配色（模仿 LOL 客户端 position icon），未选灰度化、选中恢复彩色 + 金边。最接近游戏内观感，色彩丰富。</p>
  <div class="toolbar">
    <input class="search" placeholder="搜索英雄...">
    <div class="lanes">
      <!-- 上单:品红 + 剑 -->
      <button class="lane-btn" data-lane="top" title="上单" aria-label="上单">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M12 2 L14 4 L14 15 L12 17 L10 15 L10 4 Z"/>
          <rect x="8" y="6" width="8" height="2"/>
          <rect x="11" y="16" width="2" height="5"/>
        </svg>
      </button>
      <!-- 打野:翠绿 + 爪痕 -->
      <button class="lane-btn" data-lane="jungle" title="打野" aria-label="打野">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M5 4 C7 8 7 12 6 16 C5 14 4 10 5 4 Z"/>
          <path d="M11 3 C12 8 12 13 11 18 C10 15 10 9 11 3 Z"/>
          <path d="M17 4 C19 8 19 12 18 16 C17 14 16 10 17 4 Z"/>
        </svg>
      </button>
      <!-- 中单:正红 + 法球 -->
      <button class="lane-btn" data-lane="mid" title="中单" aria-label="中单">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="3" fill="#fff" opacity="0.4"/>
          <path d="M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <!-- 下路:青蓝 + 弓箭 -->
      <button class="lane-btn" data-lane="bot" title="下路" aria-label="下路">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M6 3 C6 9 6 15 6 21 C9 18 9 6 6 3 Z" opacity="0.5"/>
          <path d="M4 11 L18 11 L18 8 L22 12 L18 16 L18 13 L4 13 Z"/>
        </svg>
      </button>
      <!-- 辅助:金黄 + 心形/十字 -->
      <button class="lane-btn" data-lane="support" title="辅助" aria-label="辅助">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M12 21 C7 17 3 13 3 9 C3 6 5 4 8 4 C10 4 11 5 12 7 C13 5 14 4 16 4 C19 4 21 6 21 9 C21 13 17 17 12 21 Z"/>
        </svg>
      </button>
    </div>
    <span class="count">共 173 位英雄</span>
  </div>
  <p class="hint">未选灰度化、选中恢复彩色 + 金边。hover 显示中文。</p>
  <div class="legend">
    <span><i style="background:var(--lane-top)"></i>上单</span>
    <span><i style="background:var(--lane-jungle)"></i>打野</span>
    <span><i style="background:var(--lane-mid)"></i>中单</span>
    <span><i style="background:var(--lane-bot)"></i>下路</span>
    <span><i style="background:var(--lane-support)"></i>辅助</span>
  </div>
</div>
<script>
  document.querySelectorAll('.lane-btn').forEach(b => b.addEventListener('click', () => b.classList.toggle('active')));
</script>
</body>
</html>
