<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案2 - 字母圆牌风格</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lol-gold:#FFB300; --lol-gold-light:#FFCA28;
    --bg-dark:#15151A; --bg-secondary:#1F1F28; --bg-card:#25252F;
    --lol-black:#010a13; --border:#2E2E3A;
    --text-muted:#8A8A99; --text-secondary:#CCCCCC;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg-dark); color:#fff; padding:24px; }
  .container { max-width:720px; margin:0 auto; }
  h1 { font-size:18px; margin-bottom:4px; color:var(--lol-gold); }
  .desc { color:var(--text-muted); font-size:13px; margin-bottom:20px; line-height:1.6; }
  .toolbar {
    display:flex; align-items:center; gap:6px; padding:12px;
    background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px;
  }
  .search {
    width:144px; flex-shrink:0; padding:8px 12px; font-size:14px;
    background:var(--lol-black); border:1px solid var(--border); border-radius:4px; color:#fff;
    font-family:inherit;
  }
  .search::placeholder { color:var(--text-muted); }
  .lanes { display:flex; align-items:center; gap:4px; }
  .lane-btn {
    width:32px; height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border-radius:50%; cursor:pointer; transition:all .15s;
    border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary);
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:14px;
  }
  .lane-btn:hover { border-color:rgba(255,179,0,0.6); color:#fff; }
  .lane-btn.active {
    border:2px solid var(--lol-gold); background:var(--lol-gold); color:#000;
    box-shadow:2px 2px 5px 0 #000; width:30px; height:30px;
  }
  .count { margin-left:auto; flex-shrink:0; font-size:12px; color:var(--text-muted); }
  .scheme-tag {
    position:fixed; top:16px; right:24px; z-index:100;
    background:var(--lol-gold); color:#000; padding:6px 14px;
    border-radius:4px; font-weight:700; font-size:12px; font-family:'Orbitron';
  }
  .hint { margin-top:16px; font-size:12px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="scheme-tag">方案2 · 字母圆牌</div>
<div class="container">
  <h1>方案 2 · 字母圆牌风格</h1>
  <p class="desc">圆形牌 + 大写首字母（T/J/M/A/S），用 Orbitron 字体。最简洁、辨识度最高，但缺少 LOL 语义，纯符号化。</p>
  <div class="toolbar">
    <input class="search" placeholder="搜索英雄...">
    <div class="lanes">
      <button class="lane-btn" title="上单 Top" aria-label="上单">T</button>
      <button class="lane-btn" title="打野 Jungle" aria-label="打野">J</button>
      <button class="lane-btn" title="中单 Mid" aria-label="中单">M</button>
      <button class="lane-btn" title="下路 ADC" aria-label="下路">A</button>
      <button class="lane-btn" title="辅助 Support" aria-label="辅助">S</button>
    </div>
    <span class="count">共 173 位英雄</span>
  </div>
  <p class="hint">圆形牌 + 字母，hover 显示中文全名。优点：一眼就能区分；缺点：无 LOL 语境，需记忆字母对应。</p>
</div>
<script>
  document.querySelectorAll('.lane-btn').forEach(b => b.addEventListener('click', () => b.classList.toggle('active')));
</script>
</body>
</html>
