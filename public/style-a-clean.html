<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>原型 A · 干净直播风</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     原型 A · Clean Broadcast(干净直播风)
     核心:纯矩形+微圆角 + 中性深灰 + 低饱和蓝红 + 零装饰 + 专业克制
     ============================================================ */
  :root{
    --bg:#1E1E1E; --bg2:#252525; --card:#2A2A2A; --card2:#303030;
    --blue:#4A90E2; --blue-dim:#2C5C8F; --red:#E74C3C; --red-dim:#A03226;
    --purple:#9B59B6; --text:#FFFFFF; --muted:#999; --line:#3A3A3A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Rajdhani',sans-serif;color:var(--text);background:var(--bg)}

  .app{display:flex;flex-direction:column;height:100vh}

  /* ============ Header ============ */
  header{
    height:56px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 20px;
    background:#232323;border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Orbitron';font-weight:700;font-size:16px;letter-spacing:1px;color:var(--text)}
  .phase-info{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .phase-info .step{font-family:'Orbitron';color:var(--text)}
  .phase-info .bar{width:140px;height:3px;background:#3A3A3A;overflow:hidden}
  .phase-info .bar i{display:block;height:100%;width:35%;background:var(--blue)}
  .btn{font-family:'Rajdhani';font-weight:600;font-size:13px;padding:7px 16px;color:#DDD;
    background:#2A2A2A;border:1px solid #3A3A3A;cursor:pointer;transition:.2s;border-radius:4px}
  .btn:hover{background:#333;color:#FFF}

  /* ============ Main 三列 ============ */
  main{flex:1;display:grid;grid-template-columns:1fr minmax(440px,1.6fr) 1fr;gap:12px;padding:12px;min-height:0}
  .panel{display:flex;flex-direction:column;gap:10px;min-height:0}

  /* 队标条 */
  .team-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0;border-radius:6px}
  .team-bar.blue{background:linear-gradient(90deg,rgba(74,144,226,.12),transparent);border-left:3px solid var(--blue)}
  .team-bar.red{background:linear-gradient(270deg,rgba(231,76,60,.12),transparent);border-right:3px solid var(--red);flex-direction:row-reverse}
  .team-bar .dot{width:8px;height:8px;border-radius:50%}
  .team-bar.blue .dot{background:var(--blue)}
  .team-bar.red .dot{background:var(--red)}
  .team-bar h2{font-family:'Orbitron';font-weight:700;font-size:14px;letter-spacing:1px}
  .team-bar.blue h2{color:var(--blue)}
  .team-bar.red h2{color:var(--red)}

  /* ban-row */
  .ban-row{display:grid;gap:6px;flex-shrink:0}
  .ban-row.r3{grid-template-columns:repeat(3,1fr);height:76px}
  .ban-row.r2{grid-template-columns:repeat(2,1fr);height:76px}
  .pick-col{display:flex;flex-direction:column;gap:6px;min-height:0}
  .pick-col.grow{flex:1}
  .pick-col.grow2{flex:.67}

  /* 槽位通用:纯矩形+微圆角 */
  .slot{position:relative;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px}
  .slot .num{font-family:'Orbitron';font-size:14px;color:#555}
  .ban{aspect-ratio:1;height:100%;justify-self:center}
  .ban.filled img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.5)}
  .pick{width:100%}
  .pick.blue.filled{border-color:var(--blue);border-width:2px}
  .pick.red.filled{border-color:var(--red);border-width:2px}
  .pick.filled img{width:100%;height:100%;object-fit:cover;object-position:center top}
  .pick .name{position:absolute;left:0;right:0;bottom:0;padding:4px 10px;font-family:'Rajdhani';font-weight:700;font-size:13px;
    background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}
  .pick.blue .name{color:#B8D4F0}
  .pick.red .name{color:#F0B8B0}

  /* ============ 中列 英雄选择 ============ */
  .center{display:flex;flex-direction:column;gap:10px;min-height:0;background:#232323;border-radius:8px;border:1px solid var(--line)}
  .filter-row{display:flex;gap:8px;padding:10px;flex-shrink:0;align-items:center}
  .search{flex:1;background:#1A1A1A;border:1px solid var(--line);padding:9px 14px;color:var(--text);font-family:'Rajdhani';font-size:14px;border-radius:6px}
  .search::placeholder{color:#666}
  .search:focus{outline:none;border-color:var(--blue)}
  .role-tabs{display:flex;gap:4px}
  .role-tab{padding:7px 12px;font-size:12px;font-weight:600;border:1px solid var(--line);cursor:pointer;color:var(--muted);border-radius:4px}
  .role-tab.active{background:var(--blue);border-color:var(--blue);color:#FFF}
  .hero-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:4px 10px;min-height:0}
  .hero{position:relative;cursor:pointer;background:transparent;border:1px solid transparent;border-radius:4px;transition:.2s}
  .hero:hover{background:#2A2A2A;border-color:#444}
  .hero img{width:100%;aspect-ratio:1;object-fit:cover;background:#000;border-radius:4px}
  .hero .hname{display:block;text-align:center;font-size:12px;padding:3px 0;color:#BBB}
  .hero.disabled{filter:grayscale(1) brightness(.4);cursor:not-allowed}
  .hint{flex-shrink:0;text-align:center;padding:8px;font-size:13px;font-weight:600;
    background:rgba(74,144,226,.1);border-top:1px solid var(--line);color:var(--blue)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">BP SIMULATOR</div>
    <div class="phase-info">
      <span class="step">04 / 20</span>
      <div class="bar"><i></i></div>
      <span>禁用阶段 · 蓝方</span>
    </div>
    <button class="btn">撤销</button>
    <button class="btn">重置</button>
    <button class="btn">分析</button>
  </header>

  <main>
    <!-- 蓝方 -->
    <div class="panel">
      <div class="team-bar blue"><span class="dot"></span><h2>BLUE TEAM</h2></div>
      <div class="ban-row r3">
        <div class="slot ban filled"><img src="https://picsum.photos/seed/ban1/80" alt=""></div>
        <div class="slot ban filled"><img src="https://picsum.photos/seed/ban2/80" alt=""></div>
        <div class="slot ban"><span class="num">3</span></div>
      </div>
      <div class="pick-col grow">
        <div class="slot pick blue filled"><img src="https://picsum.photos/seed/p1/300/120" alt=""><span class="name">剑魔</span></div>
        <div class="slot pick blue"><span class="num">2</span></div>
        <div class="slot pick blue"><span class="num">3</span></div>
      </div>
      <div class="ban-row r2">
        <div class="slot ban"><span class="num">4</span></div>
        <div class="slot ban"><span class="num">5</span></div>
      </div>
      <div class="pick-col grow2">
        <div class="slot pick blue"><span class="num">4</span></div>
        <div class="slot pick blue"><span class="num">5</span></div>
      </div>
    </div>

    <!-- 中列 -->
    <div class="center">
      <div class="filter-row">
        <input class="search" placeholder="搜索英雄...">
        <div class="role-tabs">
          <span class="role-tab active">全部</span>
          <span class="role-tab">坦克</span>
          <span class="role-tab">法师</span>
          <span class="role-tab">刺客</span>
        </div>
      </div>
      <div class="hero-grid" id="grid"></div>
      <div class="hint">禁用英雄 · 蓝方回合</div>
    </div>

    <!-- 红方 -->
    <div class="panel">
      <div class="team-bar red"><span class="dot"></span><h2>RED TEAM</h2></div>
      <div class="ban-row r3">
        <div class="slot ban filled"><img src="https://picsum.photos/seed/rban1/80" alt=""></div>
        <div class="slot ban"><span class="num">2</span></div>
        <div class="slot ban"><span class="num">3</span></div>
      </div>
      <div class="pick-col grow">
        <div class="slot pick red"><span class="num">1</span></div>
        <div class="slot pick red"><span class="num">2</span></div>
        <div class="slot pick red"><span class="num">3</span></div>
      </div>
      <div class="ban-row r2">
        <div class="slot ban"><span class="num">4</span></div>
        <div class="slot ban"><span class="num">5</span></div>
      </div>
      <div class="pick-col grow2">
        <div class="slot pick red"><span class="num">4</span></div>
        <div class="slot pick red"><span class="num">5</span></div>
      </div>
    </div>
  </main>
</div>

<script>
  const names=['剑魔','阿狸','阿卡丽','阿克尚','牛头','安蓓萨','阿木木','冰鸟','安妮','厄斐琉斯','艾希','龙王','阿萝拉','阿兹尔','巴德','卑尔维斯','布里茨','火男','布隆','贝蕾亚','女警','卡蜜尔','蛇女','大虫子','库奇','诺手','皎月','德莱文','蒙多','艾克','蜘蛛','寡妇','EZ','稻草人','剑姬','小鱼人','加里奥','船长','盖伦','纳尔'];
  const grid=document.getElementById('grid');
  const disabled=new Set([0]);
  names.forEach((n,i)=>{
    const d=document.createElement('div');
    d.className='hero'+(disabled.has(i)?' disabled':'');
    d.innerHTML=`<img src="https://picsum.photos/seed/h${i}/80" alt=""><span class="hname">${n}</span>`;
    grid.appendChild(d);
  });
</script>
</body>
</html>
